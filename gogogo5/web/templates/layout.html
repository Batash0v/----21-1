{{define "layout"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{.Title}} - Учёт трат</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <b>Учёт личных трат</b> |
        {{if .Email}}
        <a href="/">Список трат</a>
        <a href="/expenses/new">Добавить трату</a>
        <a href="/about">О проекте</a>
        <span class="user">
            {{.Email}}
            <form method="POST" action="/logout" class="inline">
                <button type="submit">Выйти</button>
            </form>
        </span>
        {{else}}
        <a href="/about">О проекте</a>
        <a href="/login">Вход</a>
        <a href="/register">Регистрация</a>
        {{end}}
    </header>

    <main>
        {{template "content" .}}
    </main>
</body>
</html>
{{end}}
